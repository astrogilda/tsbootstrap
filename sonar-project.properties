# SonarCloud automatic-analysis configuration.
# Scope the quality gate to the shipped library (src/), so it reflects product
# code quality, not pedantry in tests, CI helper scripts, docs, benchmarks, or
# examples. Coverage is gated locally per file in CI (scripts/coverage_per_file.py),
# so Sonar is a non-blocking quality and security dashboard, not a merge gate.
sonar.projectKey=astrogilda_tsbootstrap
sonar.organization=astrogilda
sonar.sources=src
sonar.tests=tests
sonar.python.version=3.10, 3.11, 3.12, 3.13, 3.14
# .github/** is excluded for the same reason as scripts/**: it is CI plumbing, not
# shipped library code. sonar.sources=src above already says so, but SonarCloud's
# automatic analysis ignores sonar.sources and honours only these exclusions, so the
# GitHub Actions rules added to the profile after 2026-07-15 began reporting on
# workflow files the gate was never scoped to cover. Workflow security keeps a
# dedicated owner: OpenSSF Scorecard (.github/workflows/scorecard.yml) audits action
# pinning, token permissions and dangerous patterns on every push to main.
sonar.exclusions=docs/**,benchmarks/**,scripts/**,tools/**,examples/**,.github/**
