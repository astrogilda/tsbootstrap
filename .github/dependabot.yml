# Automated dependency updates with a supply-chain cooldown.
#
# The 7-day cooldown means Dependabot proposes a new release only after it has survived a
# week of public scrutiny (registry quarantine, OSV malware records), which covered the
# realistic exposure window of the 2024-2026 registry incidents. It applies to version
# updates only; security updates (raised from GitHub advisories against uv.lock) are not
# delayed by it. The same window is enforced at the resolver level by exclude-newer in
# [tool.uv], so a manual `uv lock --upgrade` and a Dependabot PR see the same candidates.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "maintenance"

  # Dependabot runs the uv it bundles and refuses a lockfile whose [tool.uv]
  # required-version excludes it, so pyproject.toml pins uv as a floor, never with ==.
  # tests/unit/test_uv_version_contract.py holds that contract.
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python-deps:
        patterns:
          - "*"
        applies-to: version-updates
    # Every sktime release caps scikit-base below its next minor (sktime 1.1.0 needs
    # scikit-base<1.1, 1.2.0 needs <1.2), and Dependabot forces one package at a time
    # (`uv lock --upgrade-package scikit-base==X`) without moving sktime with it. So a
    # scikit-base minor bump is unresolvable until a sktime release lifting the cap has
    # also cleared the 7-day cooldown; forced anyway on 2026-09-25, it backtracked sktime
    # to 0.17.2 before the sktime floor existed, and it fails the job now that it does.
    # Patch releases stay inside every cap and still come through here; OSV-Scanner reads
    # uv.lock, so a vulnerable scikit-base is still reported.
    ignore:
      - dependency-name: "scikit-base"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    labels:
      - "maintenance"
