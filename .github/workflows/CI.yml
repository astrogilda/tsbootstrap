name: CI

# Cancel superseded runs of the same branch or pull request.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  UV_MALWARE_CHECK: '1' # abort any uv resolution that hits an OSV malicious-package record
  UV_PREVIEW_FEATURES: malware-check # uv 0.12 labels the check a preview and warns on every call without this

# Minimal permissions following the principle of least privilege
permissions:
  contents: read

# Trigger CI on pushes to main and pull requests targeting main or release branches
on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/CI.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - 'release**'
    paths:
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/CI.yml'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'docs/**'

jobs:
  # Lint and static checks (fast, fails early)
  lint:
    name: Lint
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # pyproject.toml's required-version is a floor; install exactly that floor.
          resolution-strategy: lowest
          enable-cache: true
          python-version: '3.11'

      - name: Sync dev environment
        run: uv sync --extra dev --extra mcp --locked

      - name: Run ruff check
        run: uv run --locked ruff check .

      - name: Run ruff format check
        run: uv run --locked ruff format --check .

  # Static type checking: both mypy and pyright must reach zero errors (blocking).
  types:
    name: Types (mypy + pyright)
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # pyproject.toml's required-version is a floor; install exactly that floor.
          resolution-strategy: lowest
          enable-cache: true
          python-version: '3.12'

      - name: Sync dev environment
        run: uv sync --extra dev --extra mcp --locked

      - name: Run mypy
        run: uv run --locked mypy src/tsbootstrap

      - name: Run pyright
        run: uv run --locked pyright src/tsbootstrap

  # Run the full suite across supported Python versions on Linux. The release
  # workflow separately verifies installed wheels on macOS and Windows.
  test:
    name: Test (Linux, Python ${{ matrix.python-version }})
    runs-on: ubicloud-standard-4
    strategy:
      fail-fast: false
      matrix:
        # Supported Python versions per pyproject (>=3.10,<3.15)
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv and Python ${{ matrix.python-version }}
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # pyproject.toml's required-version is a floor; install exactly that floor.
          resolution-strategy: lowest
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Sync dev environment
        run: uv sync --extra dev --extra mcp --locked

      - name: Show installed dependencies
        run: uv pip list

      # Run the full suite once, including the slow statistical gate, with coverage.
      # The xdist flags are passed here rather than in pyproject [tool.pytest.ini_options],
      # because addopts reaches every pytest invocation in the repository and the callers
      # that must stay single-process should not have to undo it. --dist loadscope keeps
      # each test class on one worker, so class-scoped fixtures are built once.
      - name: Run tests
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run --locked pytest tests/ -n auto --dist loadscope --max-worker-restart 3 --cov=src/tsbootstrap --cov-report=xml --cov-report=term

      - name: Publish code coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  # Per-file coverage gate (blocking). Unlike codecov.io (which is
  # informational only, see codecov.yml) this fails the build when any single
  # source file drops below 80% line coverage. Runs once on ubuntu + Python
  # 3.12; coverage is platform- and version-agnostic for this pure-Python
  # library, so one cell is the authority.
  coverage-gate:
    name: Per-file coverage gate
    runs-on: ubicloud-standard-4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # pyproject.toml's required-version is a floor; install exactly that floor.
          resolution-strategy: lowest
          enable-cache: true
          python-version: '3.12'

      - name: Sync dev environment
        run: uv sync --extra dev --extra mcp --locked

      # As in the test job above, the xdist flags belong to the caller that wants them.
      - name: Run tests with coverage
        env:
          HYPOTHESIS_PROFILE: ci
        run: uv run --locked pytest tests/ -n auto --dist loadscope --max-worker-restart 3 --cov=src/tsbootstrap --cov-report=xml

      - name: Generate coverage.json
        run: uv run --locked coverage json -o coverage.json

      - name: Enforce per-file coverage threshold (>=80%)
        # Excluded files are justified in the docstring table inside
        # scripts/coverage_per_file.py. The only exclusion is the package
        # __init__ re-export surface, which carries no logic.
        run: |
          test -s coverage.json || { echo 'coverage.json missing or empty: the coverage run did not produce data on this cell' >&2; exit 1; }
          uv run --locked python scripts/coverage_per_file.py coverage.json \
            --exclude src/tsbootstrap/__init__.py

  # Execute the tutorial notebooks (issue #46: notebooks must run in CI).
  # This is the execution authority; the docs build only renders committed outputs.
  notebooks:
    name: Execute tutorial notebooks
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # pyproject.toml's required-version is a floor; install exactly that floor.
          resolution-strategy: lowest
          enable-cache: true
          python-version: '3.11'

      - name: Sync the examples environment with nbmake
        run: uv sync --extra examples --extra dev --locked

      - name: Execute notebooks
        # No -n here, and none is wanted. Under xdist each worker starts its own Jupyter
        # kernel and the kernels race to bind their ZMQ ports: a loser dies with "Address
        # already in use" and nbmake reports "Kernel died before replying to kernel_info".
        # This step used to carry -n0 to cancel an "-n auto" that addopts applied to every
        # pytest run in the repository. That default is gone, so single-process is what a
        # bare pytest already does and there is nothing left to cancel.
        run: uv run --locked pytest --nbmake --nbmake-timeout=300 docs/source/tutorials/

  # Build and test documentation
  docs:
    name: Test Docs Build
    runs-on: ubicloud-standard-2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up uv and Python 3.11
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          # pyproject.toml's required-version is a floor; install exactly that floor.
          resolution-strategy: lowest
          enable-cache: true
          python-version: '3.11'

      - name: Install pandoc (required by nbsphinx)
        run: sudo apt-get update && sudo apt-get install -y pandoc

      - name: Sync documentation environment
        run: uv sync --extra docs --extra models --locked

      - name: Build Sphinx documentation
        run: |
          uv run --locked make -C docs clean
          uv run --locked make -C docs html SPHINXOPTS="-W -v"
