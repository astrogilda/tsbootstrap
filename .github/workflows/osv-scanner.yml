name: OSV-Scanner

# Two complementary scans of the locked dependency graph against the OSV database
# (CVEs plus MAL- malicious-package records):
#   - Pull requests: diff mode. Compares base and head branches and fails only when the
#     PR introduces a NEW vulnerability, so pre-existing or unfixable transitive findings
#     never block unrelated work.
#   - Weekly schedule + pushes to main: full scan of uv.lock, uploaded as SARIF to the
#     Security tab (Code Scanning) rather than failing the build, so a new advisory
#     against an unchanged lockfile surfaces as an alert instead of a red default branch.
# Suppressions, whenever needed, live in osv-scanner.toml next to uv.lock, each with a
# reason and an ignoreUntil expiry.
permissions: {}

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '30 5 * * 1' # 05:30 UTC Monday
  workflow_dispatch: {}

jobs:
  # The diff scan inlines the steps of google/osv-scanner-action's reusable PR workflow
  # rather than calling it. That workflow ends by cat-ing both scan JSONs into
  # GITHUB_OUTPUT, and GitHub caps a job's total outputs at 1 MiB. Once uv.lock passed
  # ~1 MB the two result sets crossed that cap, so the job was failed by the platform
  # ("Job outputs exceed 1,048,576 bytes") after every step had succeeded and the scan
  # itself reported no new alerts. Nothing consumes those outputs, so they are dropped.
  # The scan semantics are unchanged: scan the base, scan the head, diff, fail only on a
  # newly introduced vulnerability, and publish SARIF where code scanning is enabled.
  scan-pr:
    name: osv-scan
    if: github.event_name == 'pull_request'
    runs-on: ubicloud-standard-2
    permissions:
      security-events: write # upload SARIF to code scanning
      contents: read # checkout for the lockfile scan
      actions: read # the reporter reads workflow metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # both branches must be local; the checkouts below are offline

      - name: Check out the base branch
        run: git checkout "$GITHUB_BASE_REF"

      - name: Scan the base branch
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=old-results.json
            --lockfile=./uv.lock

      - name: Check out the pull request head
        run: git checkout -f "$GITHUB_SHA"

      - name: Scan the pull request head
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=new-results.json
            --lockfile=./uv.lock

      - name: Fail only on a newly introduced vulnerability
        uses: google/osv-scanner-action/osv-reporter-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --output=results.sarif
            --old=old-results.json
            --new=new-results.json
            --gh-annotations=true
            --fail-on-vuln=true

      - name: Upload SARIF to code scanning
        # Code scanning is unavailable in the private measurement repository, and
        # fork pull requests cannot write security events. The diff gate above
        # still fails on newly introduced advisories in both cases.
        if: ${{ !cancelled() && !github.event.repository.private && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif

  scan-scheduled:
    if: github.event_name != 'pull_request'
    runs-on: ubicloud-standard-2
    permissions:
      security-events: write # upload SARIF to code scanning
      contents: read # checkout for the lockfile scan
      actions: read # the reporter reads workflow metadata
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan the locked dependencies
        id: scan
        uses: google/osv-scanner-action/osv-scanner-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        continue-on-error: true
        with:
          scan-args: |-
            --format=json
            --output=results.json
            --lockfile=./uv.lock

      - name: Require completed scan results
        if: ${{ steps.scan.outcome == 'failure' }}
        run: test -s results.json

      - name: Report advisories without failing the build
        uses: google/osv-scanner-action/osv-reporter-action@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
        with:
          scan-args: |-
            --output=results.sarif
            --new=results.json
            --gh-annotations=false
            --fail-on-vuln=false

      - name: Upload SARIF to code scanning
        if: ${{ !cancelled() && !github.event.repository.private }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: results.sarif
