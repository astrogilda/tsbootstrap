name: Mutation ratchet

# Mutation testing is heavyweight (2,781 mutants over the engine + model core), so it runs
# nightly and on demand, NOT on every pull request, on GitHub-hosted runners (never a
# developer's machine). The subprocess-per-mutant runner is used because in-process mutmut
# deadlocks the numba parallel kernels. The gate fails only when a NEW survivor appears -- one
# whose refactor-stable identity is not in tools/mutation_allowlist.txt (the accepted
# equivalents); catalogued equivalents do not fail it.
#
# The run is split into SHARDS jobs and gated by one final job. As a single job it took four to
# five and a half hours, within half an hour of the six-hour ceiling on a hosted-runner job,
# which timeout-minutes cannot raise; on 2026-09-25 the runner was lost at 5h38m and the night
# produced no verdict. Each shard job runs a round-robin slice of the sorted mutant names and
# uploads a record naming its shard, the shard count and the size of the full enumeration. The
# gate job regenerates the same mutants and passes only when the records together ran every
# enumerated mutant exactly once (tools/mutation_shards.py); a lost shard fails the run, it
# never shrinks it. Change SHARDS and the matrix below together.
#
# Requires a repo secret MUTATION_RATCHET_TOKEN (a fine-grained PAT with read access to the private
# astrogilda/mutation-ratchet-core repo) so the Layer-2 package can be installed.
permissions:
  contents: read

# One gate run at a time; a manual dispatch queues behind the nightly instead of racing it.
concurrency:
  group: mutation-ratchet

on:
  schedule:
    - cron: '0 6 * * *'  # 06:00 UTC nightly
  workflow_dispatch: {}

env:
  SHARDS: 8

jobs:
  shard:
    name: Mutation shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    # A shard is about 350 mutants: 30 to 45 minutes at four workers on the measured runs.
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # pyproject.toml's required-version is a floor; install exactly that floor.
          resolution-strategy: lowest
          enable-cache: true
          python-version: '3.12'

      - name: Sync dev environment (with the compiled accel kernel)
        run: uv sync --extra dev --extra accel --locked

      - name: Install the Layer-2 mutation-ratchet-core
        run: |
          uv pip install \
            "git+https://x-access-token:${MRC_TOKEN}@github.com/astrogilda/mutation-ratchet-core.git"
        env:
          MRC_TOKEN: ${{ secrets.MUTATION_RATCHET_TOKEN }}

      - name: Start the memory telemetry sampler
        run: |
          nohup sh -c 'while true; do echo "$(date -u +%H:%M:%S) $(free -m | awk "/^Mem:/ {print \$3\" used / \"\$2\" total\"}")" >> /tmp/memlog.txt; sleep 10; done' &

      - name: Generate mutants and run this shard
        env:
          HYPOTHESIS_PROFILE: mutmut
          PYTHONUNBUFFERED: '1'
          SHARD: ${{ matrix.shard }}
        run: |
          mkdir -p shard-records
          uv run python tools/run_mutation_gate.py --regen --workers 4 \
            --shard "${SHARD}/${SHARDS}" --out "shard-records/${SHARD}.json"

      - name: Print the memory telemetry
        if: always()
        run: cat /tmp/memlog.txt || true

      - name: Upload this shard's record
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-shard-${{ matrix.shard }}
          path: shard-records/${{ matrix.shard }}.json
          if-no-files-found: error

  gate:
    name: Mutation ratchet (engine + model core)
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv and Python 3.12
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          # pyproject.toml's required-version is a floor; install exactly that floor.
          resolution-strategy: lowest
          enable-cache: true
          python-version: '3.12'

      - name: Sync dev environment (with the compiled accel kernel)
        run: uv sync --extra dev --extra accel --locked

      - name: Install the Layer-2 mutation-ratchet-core
        run: |
          uv pip install \
            "git+https://x-access-token:${MRC_TOKEN}@github.com/astrogilda/mutation-ratchet-core.git"
        env:
          MRC_TOKEN: ${{ secrets.MUTATION_RATCHET_TOKEN }}

      - name: Collect every shard's record
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: mutation-shard-*
          merge-multiple: true
          path: shard-records

      - name: Merge the shards and run the new-survivor gate
        env:
          HYPOTHESIS_PROFILE: mutmut
          PYTHONUNBUFFERED: '1'
        run: uv run python tools/run_mutation_gate.py --merge-shards shard-records --shards "${SHARDS}"

      - name: Upload per-mutant outcomes
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mutation-outcomes
          path: mutation_outcomes.json
          if-no-files-found: warn
